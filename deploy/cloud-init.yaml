#cloud-config
# Provider-neutral bootstrap for a self-hosted Buzz/Nostr relay.
# Works on any cloud VM (or bare host) that accepts cloud-init: installs Docker,
# clones this repo, and runs the quickstart (which generates fresh local secrets and
# brings up the stack). Relay listens on http/ws port 3000.
#
# Sanitized: quickstart generates secrets on the host; commits none. Pin the relay
# image tag in deploy/.env against upstream (github.com/block/buzz) before production.

package_update: true
packages:
  - docker.io
  - docker-compose-plugin
  - git
  - openssl

runcmd:
  - systemctl enable --now docker
  - git clone --depth 1 https://github.com/michaeloboyle/nostr-buzz-eval /opt/nostr-buzz-eval
  - chmod +x /opt/nostr-buzz-eval/deploy/quickstart.sh
  - cd /opt/nostr-buzz-eval/deploy && ./quickstart.sh
  - cd /opt/nostr-buzz-eval/deploy && docker compose ps
